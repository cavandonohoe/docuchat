# Weekly dependency updates. Minor/patch bumps are grouped and auto-merged by
# .github/workflows/dependabot-automerge.yml once CI passes; majors stay manual.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (via eslint-config-next) supports TS <6.1 only.
      # Drop this once it adds TypeScript 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
